# File: Build-immortalwrt-single.yml — ImmortalWrt 单设备手动编译
# Copyright (c) 2024-2026 QC3284. GPL-3.0-only.
# https://github.com/QC3284/openwrt-actions
#
# ⚠️ 同步提醒：本文件与 Build-immortalwrt.yml 共享约 70% 编译逻辑。
# 修改编译流程（setup/compile/package/release）时，请同步检查另一个文件是否需要相同更新。

name: 编译 ImmortalWrt 单设备 (Single Device Build)

on:
  workflow_dispatch:
    inputs:
      device:
        description: '设备名 (如 glinet_gl-mt3000)'
        required: true
        type: string
      branch:
        description: '源码分支 (留空则使用配置文件中的分支，默认 25.12)'
        required: false
        type: string
        default: ''
      config:
        description: '配置文件路径 (留空则自动选取最新)'
        required: false
        type: string
        default: ''
      diy_enabled:
        description: '启用 DIY 脚本 (true/false，留空则读取 control 文件)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  OPENWRT_DIR: /workdir/openwrt
  FW_GLOB: "*.bin *.img *.fit *.itb *.fip *.ubi"
  ERROR_PATTERN: 'error:|error [0-9]+|fatal|FAILED|collect2|No rule to make target|make\[[0-9]+\].*Error|Segmentation fault|undefined reference|No such file|cannot find|patch.*failed|Hunk.*FAILED'
  SOURCE_CODE_URL_FILE: ${{ github.workspace }}/config/immortalwrt-url.txt
  LOG_TRUNCATE_LINES: 100000
  LOG_KEEP_LINES: 3000
  # 单设备 ccache 缓存上限
  CCACHE_MAXSIZE: 2G

# GITHUB_TOKEN 最小权限: 创建 Release 需要 contents: write
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出仓库 (Checkout Repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 解析参数 (Parse Inputs)
        id: parse
        run: |
          DEVICE="${{ inputs.device }}"
          BRANCH_OVERRIDE="${{ inputs.branch }}"
          CONFIG_OVERRIDE="${{ inputs.config }}"
          CONFIG_DIR="${{ github.workspace }}/config/immortalwrt-mt798x"
          BRANCH_FILE="${{ github.workspace }}/config/immortalwrt-device-branch.txt"
          DEFAULT_BRANCH_FILE="${{ github.workspace }}/config/immortalwrt-default-branch.txt"
          if [ ! -f "$DEFAULT_BRANCH_FILE" ]; then
            echo "::error::默认分支配置文件不存在: $DEFAULT_BRANCH_FILE"
            exit 1
          fi
          DEFAULT_BRANCH=$(head -1 "$DEFAULT_BRANCH_FILE" | tr -d '[:space:]')
          [ -n "$DEFAULT_BRANCH" ] || { echo "::error::默认分支配置为空"; exit 1; }

          # 确定配置文件
          if [ -n "$CONFIG_OVERRIDE" ]; then
            if [ -f "$CONFIG_OVERRIDE" ]; then
              CONFIG_FILE="$CONFIG_OVERRIDE"
            elif [ -f "$CONFIG_DIR/$CONFIG_OVERRIDE" ]; then
              CONFIG_FILE="$CONFIG_DIR/$CONFIG_OVERRIDE"
            else
              echo "::error::指定的配置文件不存在: $CONFIG_OVERRIDE"
              exit 1
            fi
          else
            # 自动选取该设备最新的配置文件
            LATEST_DATETIME=""
            while IFS= read -r -d '' file; do
              filename=$(basename "$file")
              if [[ "$filename" =~ ^immortalwrt-actions-([a-z0-9]+)-(.+)-([0-9]{14})\.config$ ]]; then
                dev="${BASH_REMATCH[2]}"
                dt="${BASH_REMATCH[3]}"
                if [ "$dev" = "$DEVICE" ] && [ "$dt" \> "$LATEST_DATETIME" ] 2>/dev/null; then
                  CONFIG_FILE="$file"
                  LATEST_DATETIME="$dt"
                fi
              fi
            done < <(find "$CONFIG_DIR" -maxdepth 1 -type f -name "immortalwrt-actions-*.config" -print0)
            if [ -z "$CONFIG_FILE" ]; then
              echo "::error::未找到设备 [$DEVICE] 的配置文件"
              exit 1
            fi
          fi
          echo "设备: $DEVICE"
          echo "配置: $CONFIG_FILE"

          # 确定分支
          if [ -n "$BRANCH_OVERRIDE" ]; then
            BRANCH="$BRANCH_OVERRIDE"
            echo "分支 (手动): $BRANCH"
          else
            BRANCH="$DEFAULT_BRANCH"
            if [ -f "$BRANCH_FILE" ]; then
              # || true: 分支表全为注释时 grep 退出码 1，默认 shell (-e -o pipefail) 会终止步骤
              MATCH=$(grep -v '^[[:space:]]*\(#.*\|$\)' "$BRANCH_FILE" | awk -v d="$DEVICE" '$1 == d {print $2; exit}' || true)
              [ -n "$MATCH" ] && BRANCH="$MATCH"
            fi
            echo "分支 (配置): $BRANCH"
          fi

          echo "DEVICE_NAME=$DEVICE" >> $GITHUB_ENV
          echo "CONFIG_FILE=$CONFIG_FILE" >> $GITHUB_ENV
          echo "BUILD_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: 设置系统时区 (Set System Timezone)
        run: |
          sudo timedatectl set-timezone "$TZ"
          date

      - name: 创建工作目录 (Create Work Directory)
        run: |
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir

      - name: 释放磁盘空间 (Free Disk Space)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装必要软件包 (Install Necessary Packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ccache ecj fastjar file flex g++ gcc-multilib g++-multilib gawk gettext git git-core \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev swig python3 \
            python3-pip python3-dev python3-setuptools python3-pyelftools subversion unzip wget zlib1g-dev \
            rsync qemu-utils zip libfuse-dev neofetch p7zip-full curl device-tree-compiler gperf haveged \
            help2man intltool lib32gcc-s1 libc6-dev-i386 libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip patch pkgconf python3-ply python3-docutils re2c \
            scons squashfs-tools texinfo uglifyjs upx-ucl vim xmlto xxd zstd

      - name: 拉取源码 (Pull Source Code)
        working-directory: /workdir
        run: |
          URL="$(cat "${{ env.SOURCE_CODE_URL_FILE }}")"
          echo "源码 URL: $URL"
          # partial clone: blob 按需下载，随后按分支 fetch/checkout，大幅缩短克隆时间
          git clone --filter=blob:none --no-checkout "$URL" openwrt

      - name: 链接源码目录 (Link Source Code Directory)
        run: |
          ln -sf ${{ env.OPENWRT_DIR }} ${{ github.workspace }}/openwrt

      - name: 缓存依赖包下载目录 (Cache dl Directory)
        # dl 内容由 make download 逐文件哈希校验，缓存失效最多导致重新下载，不会产生陈旧固件
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.OPENWRT_DIR }}/dl
          key: dl-${{ inputs.device }}-${{ hashFiles('config/immortalwrt-mt798x/*.config') }}
          restore-keys: |
            dl-${{ inputs.device }}-

      - name: 缓存 ccache 编译缓存 (Cache ccache)
        # ccache 按预处理内容哈希命中，上游更新自动 miss 重编，不会产生陈旧产物
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.OPENWRT_DIR }}/.ccache
          key: ccache-${{ inputs.device }}-${{ hashFiles('config/immortalwrt-mt798x/*.config') }}
          restore-keys: |
            ccache-${{ inputs.device }}-

      - name: 切换源码分支 (Switch Source Branch)
        run: |
          bash ${{ github.workspace }}/script/immortalwrt-switch-branch.sh \
            "$DEVICE_NAME" \
            "${{ env.OPENWRT_DIR }}" \
            "${{ github.workspace }}/config/immortalwrt-device-branch.txt" \
            "${{ github.workspace }}/config/immortalwrt-default-branch.txt" \
            "$BUILD_BRANCH"

      - name: 更新并安装 Feeds (Update and Install Feeds)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          DIY_CTL="${{ github.workspace }}/config/immortalwrt-diy-control.txt"
          DIY_ENABLED=true
          if [ -n "${{ inputs.diy_enabled }}" ]; then
            [ "${{ inputs.diy_enabled }}" = "false" ] && DIY_ENABLED=false
            echo "DIY 控制: 手动指定为 $DIY_ENABLED"
          elif [ -f "$DIY_CTL" ]; then
            # || true: grep 无匹配时退出码为 1，GitHub 默认 shell (-e -o pipefail) 会直接终止步骤
            STATUS=$(grep -v '^[[:space:]]*#' "$DIY_CTL" | awk -v d="$DEVICE_NAME" '$1 == d {print $2; exit}' || true)
            [ "$STATUS" = "false" ] && DIY_ENABLED=false
            echo "DIY 控制: 从文件读取为 $DIY_ENABLED"
          fi
          if [ "$DIY_ENABLED" = "true" ]; then
            echo "DIY 已启用，执行自定义脚本"
            bash ${{ github.workspace }}/script/immortalwrt-actions-diy1.sh
            ./scripts/feeds update -a
            bash ${{ github.workspace }}/script/immortalwrt-actions-diy2.sh
          else
            echo "DIY 已禁用，跳过自定义脚本"
            ./scripts/feeds update -a
          fi
          ./scripts/feeds install -a

      - name: 准备配置文件 (Prepare Config File)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cp "${{ env.CONFIG_FILE }}" .config
          make defconfig
          mkdir -p files/etc/uci-defaults files/etc
          cp ${{ github.workspace }}/script/immortalwrt-uci-defaults.sh files/etc/uci-defaults/99-custom.sh
          echo "${{ inputs.device }} $(date +%Y%m%d%H%M%S) ${{ github.run_id }}" > files/etc/firmware-build-info
          bash ${{ github.workspace }}/script/x-wrt-make-001.sh

      - name: 编译固件 (Compile Firmware)
        id: compile
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          THREAD_COUNT=$(nproc)
          echo "使用 $THREAD_COUNT 线程编译"
          # 注意: GitHub 默认 shell 为 bash -e -o pipefail，make 失败时管道会立即终止步骤，
          # 使 -j1 重试与失败诊断链失效；关闭 pipefail 后 tee 管道恢复原有语义，
          # EXIT_CODE=${PIPESTATUS[0]} 才能正确捕获 make 退出码 (管道尾加 || true 会重置 PIPESTATUS)
          set +o pipefail
          make -j$THREAD_COUNT 2>&1 | tee make.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "多线程编译失败，切换单线程详细模式..."
            make -j1 V=s 2>&1 | tee -a make.log
            EXIT_CODE=${PIPESTATUS[0]}
          fi
          if [ $EXIT_CODE -eq 0 ]; then
            FIRMWARE_CHECK=$(find bin/targets -mindepth 2 -maxdepth 2 -type d 2>/dev/null | head -1)
            if [ -n "$FIRMWARE_CHECK" ]; then
              echo "编译成功完成！"
              echo "compile_completed=true" >> $GITHUB_OUTPUT
            else
              echo "编译通过但未生成固件文件 (可能 .config 未选择目标设备)"
              echo "compile_completed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "编译失败，退出码: $EXIT_CODE"
            echo "compile_completed=false" >> $GITHUB_OUTPUT
          fi

          LOG_LINES=$(wc -l < make.log)
          if [ "$LOG_LINES" -gt "$LOG_TRUNCATE_LINES" ]; then
            echo "make.log 过大 ($LOG_LINES 行), 保留首尾各 $LOG_KEEP_LINES 行"
            head -$LOG_KEEP_LINES make.log > make.log.tmp
            echo "" >> make.log.tmp
            echo "...... [中间省略 $((LOG_LINES - LOG_KEEP_LINES * 2)) 行] ......" >> make.log.tmp
            echo "" >> make.log.tmp
            tail -$LOG_KEEP_LINES make.log >> make.log.tmp
            mv make.log.tmp make.log
            echo "make.log 已截断至 $(wc -l < make.log) 行"
          fi

      # ---------- 编译失败处理 ----------
      - name: 生成错误报告 (Generate Error Report)
        if: steps.compile.outputs.compile_completed == 'false'
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          {
            echo "## 编译失败 - ${{ inputs.device }}"
            echo ""
            echo "### 关键错误信息 (最后 50 条)"
            echo '```'
            grep -inE "$ERROR_PATTERN" make.log | tail -50 || echo "未匹配到关键错误"
            echo '```'
            echo ""
            echo "### 日志末尾 100 行"
            echo '```'
            tail -100 make.log
            echo '```'
          } > error_report.md
          cat error_report.md >> $GITHUB_STEP_SUMMARY

      - name: 上传失败日志 (Upload Failure Log)
        if: steps.compile.outputs.compile_completed == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: failed-build-log-${{ inputs.device }}-${{ github.run_id }}
          path: |
            ${{ env.OPENWRT_DIR }}/make.log
            ${{ env.OPENWRT_DIR }}/error_report.md
          retention-days: 7

      - name: 生成失败 Release 信息 (Generate Failure Release Info)
        if: steps.compile.outputs.compile_completed == 'false'
        id: failed_release
        run: |
          BUILD_DATETIME=$(date +"%Y%m%d%H%M")
          echo "BUILD_DATETIME=$BUILD_DATETIME" >> $GITHUB_ENV
          RELEASE_TAG="${{ inputs.device }}-failed-${BUILD_DATETIME}-${{ github.run_id }}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release_failed.txt <<EOF
          ## ❌ Build Failed — \`${{ inputs.device }}\`

          $(date '+%Y-%m-%d %H:%M:%S %Z') · \`${{ inputs.device }}\` · ${{ env.BUILD_BRANCH }}

          **Source**  $(cat "${{ env.SOURCE_CODE_URL_FILE }}")

          ### 🔍 Error Summary

          EOF
          cat ${{ env.OPENWRT_DIR }}/error_report.md >> release_failed.txt
          {
            echo ""
            echo "---"
            echo "> 📋 Full log: **make.log** · [${{ github.workflow }} #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> release_failed.txt

      - name: 发布失败 Release (Create Failure Release)
        if: steps.compile.outputs.compile_completed == 'false'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.failed_release.outputs.release_tag }}
          name: "[编译失败] ${{ inputs.device }} - ${{ env.BUILD_DATETIME }}"
          body_path: release_failed.txt
          files: |
            ${{ env.OPENWRT_DIR }}/make.log
            ${{ env.OPENWRT_DIR }}/error_report.md
          draft: true
          prerelease: true

      # ---------- 编译成功处理 ----------
      - name: 压缩并整理固件 (Compress and Organize Firmware)
        if: steps.compile.outputs.compile_completed == 'true'
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # || true: bin/targets 不存在时 find 返回非零，默认 shell (-e -o pipefail) 会终止步骤，
          # 使下方的空目录检查成为死代码
          TARGET_PATH=$(find bin/targets -mindepth 2 -maxdepth 2 -type d 2>/dev/null | head -n 1 || true)
          if [ -z "$TARGET_PATH" ]; then
            echo "::warning::未找到编译输出目录，跳过固件打包"
            exit 0
          fi
          TARGET_NAME="${TARGET_PATH#bin/targets/}"
          echo "输出目录: $TARGET_PATH"
          echo "可用磁盘空间:"
          df -h .

          7z a -mx=9 -mmt=$(nproc) bin.7z bin/
          if [ $? -ne 0 ]; then
            echo "::error::bin.7z 打包失败"
            exit 1
          fi
          mv bin.7z "$TARGET_PATH/"
          mv make.log "$TARGET_PATH/"
          cd "$TARGET_PATH" || { echo "::error::无法进入 $TARGET_PATH"; exit 1; }
          rm -rf packages
          ls -la $FW_GLOB *.7z *.log 2>/dev/null || true

          # 给固件文件名追加时间戳 (失败自动重试一次)
          TS_SUFFIX="_$(date +%Y%m%d%H%M)"
          for f in $FW_GLOB; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            newname="${base}${TS_SUFFIX}.${ext}"
            if mv "$f" "$newname" 2>/dev/null; then
              echo "  重命名: $f -> $newname"
            else
              sleep 1
              if [ -f "$newname" ]; then
                rm -f "$f" 2>/dev/null
                echo "  重命名(清理源): $f -> $newname"
              elif mv "$f" "$newname" 2>/dev/null; then
                echo "  重命名(重试成功): $f -> $newname"
              else
                echo "  ⚠️ 重命名失败: $f (保留原名)"
              fi
            fi
          done
          echo ""

          for f in bin.7z make.log; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            newname="${base}${TS_SUFFIX}.${ext}"
            mv "$f" "$newname" 2>/dev/null && echo "  重命名: $f -> $newname"
          done
          echo ""

          echo "TARGET_DIR=${{ env.OPENWRT_DIR }}/$TARGET_PATH" >> $GITHUB_ENV
          echo "TARGET_NAME=$TARGET_NAME" >> $GITHUB_ENV

          FIRMWARE_FILES=$(ls $FW_GLOB 2>/dev/null || true)
          if [ -n "$FIRMWARE_FILES" ]; then
            if sha256sum $FIRMWARE_FILES > sha256sums.txt 2>/dev/null; then
              echo "SHA256 校验文件已生成"
            else
              sleep 1
              if sha256sum $FIRMWARE_FILES > sha256sums.txt 2>/dev/null; then
                echo "SHA256 校验文件已生成 (重试成功)"
              else
                echo "::error::SHA256 校验生成失败 (已重试)"
                exit 1
              fi
            fi
          fi

      - name: 生成构建信息 (Generate Build Info)
        if: steps.compile.outputs.compile_completed == 'true'
        run: |
          cd ${{ env.OPENWRT_DIR }}
          SOURCE_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")

          cat > ${{ env.TARGET_DIR }}/build-info.txt << EOF
          Image Builder Info
          ==========================================
          Build Date:    $(date '+%Y-%m-%d %H:%M:%S %Z')
          Workflow:      ${{ github.workflow }}
          Run ID:        ${{ github.run_id }}
          Device:        ${{ inputs.device }}
          Target:        ${{ env.TARGET_NAME }}
          Source Branch: ${{ env.BUILD_BRANCH }}
          Source Commit: ${SOURCE_COMMIT}
          GitHub Repo:   ${{ github.repository }}
          EOF
          echo "build-info.txt 已生成"

          # 存储源码信息供 Release 步骤使用
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> $GITHUB_ENV

      - name: 上传固件 Artifact (Upload Firmware Artifact)
        if: steps.compile.outputs.compile_completed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openwrt-firmware-${{ inputs.device }}
          path: ${{ env.TARGET_DIR }}/
          retention-days: 30

      - name: 生成 Release 信息 (Generate Release Info)
        if: steps.compile.outputs.compile_completed == 'true'
        id: release
        run: |
          BUILD_DATETIME=$(date +"%Y%m%d%H%M")
          RELEASE_TAG="${{ inputs.device }}-single-${BUILD_DATETIME}-${{ github.run_id }}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "BUILD_DATETIME=$BUILD_DATETIME" >> $GITHUB_ENV

          cat > release.txt << EOF
          ## ✅ ImmortalWrt Build — \`${{ inputs.device }}\`

          $(date '+%Y-%m-%d %H:%M:%S %Z') · \`${{ inputs.device }}\` · ${{ env.TARGET_NAME }}

          **Source**  $(cat "${{ env.SOURCE_CODE_URL_FILE }}")  @ \`${{ env.BUILD_BRANCH }}\` (\`${SOURCE_COMMIT}\`)  
          **Config**  \`$(basename "${{ env.CONFIG_FILE }}")\`

          ### 📦 Attached Files
          - **`*sysupgrade.bin` / `*factory.img`** — Firmware images
          - **`*preloader.bin` / `*bl31-uboot.fip`** — Bootloader files (if applicable)
          - **`bin.*.7z`** — Full build directory archive
          - **`sha256sums.txt`** — SHA256 checksums for all firmware files
          - **`build-info.txt`** — Build traceability (branch, commit, timestamp)
          - **`make.*.log`** — Compilation log

          ---
          > [${{ github.workflow }} #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

          echo "| 设备 | Target | 分支 | 完成时间 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ ${{ inputs.device }} | ${{ env.TARGET_NAME }} | ${{ env.BUILD_BRANCH }} | $(date '+%H:%M:%S') |" >> $GITHUB_STEP_SUMMARY

      - name: 发布 Release (Create Release)
        if: steps.compile.outputs.compile_completed == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: "ImmortalWrt ${{ inputs.device }} (手动) - ${{ env.BUILD_DATETIME }}"
          body_path: release.txt
          files: ${{ env.TARGET_DIR }}/*