# File: Build-immortalwrt.yml — ImmortalWrt 多设备矩阵编译
# Cron: 周二/五 19:00 UTC = 周三/六 03:00 北京时间
# Copyright (c) 2024-2026 QC3284. GPL-3.0-only.
# https://github.com/QC3284/openwrt-actions
#
# ⚠️ 同步提醒：本文件与 Build-immortalwrt-single.yml 共享约 70% 编译逻辑。
# 修改编译流程（setup/compile/package/release）时，请同步检查另一个文件是否需要相同更新。

name: 编译 ImmortalWrt (Compile ImmortalWrt)

on:
  schedule:
    - cron: '0 19 * * 2,5'
  repository_dispatch:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

env:
  TZ: Asia/Shanghai
  OPENWRT_DIR: /workdir/openwrt
  SOURCE_CODE_URL_FILE: ${{ github.workspace }}/config/immortalwrt-url.txt
  FW_GLOB: "*.bin *.img *.fit *.itb *.fip *.ubi"
  ERROR_PATTERN: 'error:|error [0-9]+|fatal|FAILED|collect2|No rule to make target|make\[[0-9]+\].*Error|Segmentation fault|undefined reference|No such file|cannot find|patch.*failed|Hunk.*FAILED'
  LOG_TRUNCATE_LINES: 100000
  LOG_KEEP_LINES: 3000

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      skip: ${{ steps.check-source.outputs.skip }}
    steps:
      - name: 检出仓库 (Checkout Repository)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 检查源码是否更新 (Check Source Updates)
        id: check-source
        timeout-minutes: 5
        run: |
          SOURCE_URL=$(cat "${{ env.SOURCE_CODE_URL_FILE }}")
          DEFAULT_BRANCH_FILE="${{ github.workspace }}/config/immortalwrt-default-branch.txt"
          if [ ! -f "$DEFAULT_BRANCH_FILE" ]; then
            echo "::error::默认分支配置文件不存在: $DEFAULT_BRANCH_FILE"
            exit 1
          fi
          DEFAULT_BRANCH=$(head -1 "$DEFAULT_BRANCH_FILE" | tr -d '[:space:]')
          [ -n "$DEFAULT_BRANCH" ] || { echo "::error::默认分支配置为空"; exit 1; }
          echo "源码仓库: $SOURCE_URL"
          echo "默认分支: $DEFAULT_BRANCH"

          BRANCH_FILE="${{ github.workspace }}/config/immortalwrt-device-branch.txt"
          ENABLE_FILE="${{ github.workspace }}/config/immortalwrt-mt798x-enable-configs.txt"
          TRACK_FILE="${{ github.workspace }}/config/immortalwrt-last-commit.txt"

          mapfile -t ENABLED_DEVICES < <(grep -v '^[[:space:]]*\(#.*\|$\)' "$ENABLE_FILE")

          get_branch() {
            local dev=$1
            local branch=$DEFAULT_BRANCH
            if [ -f "$BRANCH_FILE" ]; then
              local match=$(grep -v '^[[:space:]]*#' "$BRANCH_FILE" | awk -v d="$dev" '$1 == d {print $2; exit}')
              [ -n "$match" ] && branch="$match"
            fi
            echo "$branch"
          }

          load_stored() {
            if [ -f "$TRACK_FILE" ]; then
              grep -v '^[[:space:]]*\(#.*\|$\)' "$TRACK_FILE"
            fi
          }

          # 收集每个设备对应的分支及远端最新提交
          declare -A DEV_BRANCH
          declare -A DEV_COMMIT
          declare -A UNIQUE_BRANCHES
          for dev in "${ENABLED_DEVICES[@]}"; do
            branch=$(get_branch "$dev")
            DEV_BRANCH[$dev]=$branch
            UNIQUE_BRANCHES[$branch]=1
          done

          # 批量获取所有唯一分支的最新提交 (git ls-remote)
          echo ""
          echo "=== 获取远端提交 ==="
          for branch in "${!UNIQUE_BRANCHES[@]}"; do
            commit=$(git ls-remote "$SOURCE_URL" "refs/heads/$branch" 2>/dev/null | awk '{print $1}')
            if [ -z "$commit" ]; then
              echo "::warning::无法获取分支 $branch 的提交 ID"
              commit="unknown"
            fi
            for dev in "${ENABLED_DEVICES[@]}"; do
              if [ "${DEV_BRANCH[$dev]}" = "$branch" ]; then
                DEV_COMMIT[$dev]=$commit
              fi
            done
            echo "分支 $branch: $commit"
          done

          # 对比存储的上次提交 (仅在 schedule 触发时跳过未变更的构建)
          ALL_MATCH=true
          STORED=$(load_stored)
          for dev in "${ENABLED_DEVICES[@]}"; do
            stored_sha=$(echo "$STORED" | awk -F= -v b="${DEV_BRANCH[$dev]}" '$1 == b {print $2}')
            current_sha="${DEV_COMMIT[$dev]}"
            if [ "$stored_sha" != "$current_sha" ]; then
              ALL_MATCH=false
              echo "变更检测: $dev (分支 ${DEV_BRANCH[$dev]}) $stored_sha -> $current_sha"
            else
              echo "未变更:   $dev (分支 ${DEV_BRANCH[$dev]}) $current_sha"
            fi
          done

          # 更新跟踪文件
          for branch in "${!UNIQUE_BRANCHES[@]}"; do
            commit=""
            for dev in "${ENABLED_DEVICES[@]}"; do
              if [ "${DEV_BRANCH[$dev]}" = "$branch" ]; then
                commit="${DEV_COMMIT[$dev]}"
                break
              fi
            done
            [ -z "$commit" ] && continue
            if [ ! -f "$TRACK_FILE" ]; then
              echo "${branch}=${commit}" >> "$TRACK_FILE"
            elif awk -F= -v b="$branch" '$1 == b {exit 1}' "$TRACK_FILE" 2>/dev/null; then
              echo "${branch}=${commit}" >> "$TRACK_FILE"
            else
              sed -i "s|^${branch}=.*|${branch}=${commit}|" "$TRACK_FILE"
            fi
          done

          if [ "${{ github.event_name }}" = "schedule" ] && [ "$ALL_MATCH" = true ]; then
            echo ""
            echo "所有设备源码未变更，跳过本次编译"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo ""
            if [ "${{ github.event_name }}" != "schedule" ]; then
              echo "手动触发，跳过变更检测"
            else
              echo "检测到源码变更，继续编译"
            fi
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交源码跟踪记录 (Commit Source Tracking)
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/immortalwrt-last-commit.txt
          if git diff --cached --quiet; then
            echo "跟踪文件无变更"
          else
            git commit -m "track: update source commit [skip ci]"
            git push
          fi

      - name: 生成编译矩阵 (Generate Build Matrix)
        id: set-matrix
        if: steps.check-source.outputs.skip != 'true'
        run: |
          ENABLE_FILE="${{ github.workspace }}/config/immortalwrt-mt798x-enable-configs.txt"
          CONFIG_DIR="${{ github.workspace }}/config/immortalwrt-mt798x"

          if [ ! -f "$ENABLE_FILE" ]; then
            echo "::error::启用配置文件不存在: $ENABLE_FILE"
            exit 1
          fi

          mapfile -t ENABLED_DEVICES < <(grep -v '^[[:space:]]*\(#.*\|$\)' "$ENABLE_FILE")
          if [ ${#ENABLED_DEVICES[@]} -eq 0 ]; then
            echo "::error::启用配置文件中未包含任何设备"
            exit 1
          fi
          echo "启用的设备: ${ENABLED_DEVICES[*]}"

          declare -A LATEST_CONFIGS
          declare -A LATEST_DATETIME
          declare -A LATEST_CHIP
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ ^immortalwrt-actions-([a-z0-9]+)-(.+)-([0-9]{14})\.config$ ]]; then
              chip="${BASH_REMATCH[1]}"
              device="${BASH_REMATCH[2]}"
              datetime="${BASH_REMATCH[3]}"
              if [[ " ${ENABLED_DEVICES[*]} " == *" $device "* ]]; then
                if [[ -z "${LATEST_CONFIGS[$device]}" ]] || [[ "$datetime" > "${LATEST_DATETIME[$device]}" ]]; then
                  LATEST_CONFIGS["$device"]="$file"
                  LATEST_DATETIME["$device"]="$datetime"
                  LATEST_CHIP["$device"]="$chip"
                fi
              fi
            fi
          done < <(find "$CONFIG_DIR" -maxdepth 1 -type f -name "immortalwrt-actions-*.config" -print0)

          for dev in "${!LATEST_CONFIGS[@]}"; do
            echo "设备 [$dev] (芯片: ${LATEST_CHIP[$dev]}) 使用配置: ${LATEST_CONFIGS[$dev]} (日期: ${LATEST_DATETIME[$dev]})"
          done

          MATRIX_ITEMS=()
          for dev in "${ENABLED_DEVICES[@]}"; do
            if [ -n "${LATEST_CONFIGS[$dev]}" ]; then
              MATRIX_ITEMS+=("$(jq -cn --arg device "$dev" --arg chip "${LATEST_CHIP[$dev]}" --arg config "${LATEST_CONFIGS[$dev]}" '{device:$device,chip:$chip,config:$config}')")
            else
              echo "::warning::设备 [$dev] 未找到配置文件，已跳过"
            fi
          done
          JSON_ARRAY=$(printf '%s\n' "${MATRIX_ITEMS[@]}" | jq -sc .)

          echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          echo "::group::生成的矩阵 JSON"
          echo "$JSON_ARRAY" | jq .
          echo "::endgroup::"

  compile:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true' && needs.prepare.outputs.matrix != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      DEVICE_NAME: ${{ matrix.device }}
      CONFIG_FILE: ${{ matrix.config }}
    steps:
      - name: 检出仓库 (Checkout Repository)
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: 设置系统时区 (Set System Timezone)
        run: |
          sudo timedatectl set-timezone "$TZ"
          date

      - name: 创建工作目录 (Create Work Directory)
        run: |
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir

      - name: 释放磁盘空间 (Free Disk Space)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 安装必要软件包 (Install Necessary Packages)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ecj fastjar file flex g++ gcc-multilib g++-multilib gawk gettext git git-core \
            java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev swig python3 \
            python3-pip python3-dev python3-setuptools python3-pyelftools subversion unzip wget zlib1g-dev \
            rsync qemu-utils zip libfuse-dev neofetch p7zip-full curl device-tree-compiler gperf haveged \
            help2man intltool lib32gcc-s1 libc6-dev-i386 libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip patch pkgconf python3-ply python3-docutils re2c \
            scons squashfs-tools texinfo uglifyjs upx-ucl vim xmlto xxd zstd
          pip install requests tqdm

      - name: 拉取源码 (Pull Source Code)
        working-directory: /workdir
        run: |
          URL="$(cat "${{ env.SOURCE_CODE_URL_FILE }}")"
          echo "源码 URL: $URL"
          git clone "$URL" openwrt

      - name: 链接源码目录 (Link Source Code Directory)
        run: |
          ln -sf ${{ env.OPENWRT_DIR }} ${{ github.workspace }}/openwrt

      - name: 切换源码分支 (Switch Source Branch)
        run: |
          bash ${{ github.workspace }}/script/immortalwrt-switch-branch.sh "$DEVICE_NAME" "${{ env.OPENWRT_DIR }}" "${{ github.workspace }}/config/immortalwrt-device-branch.txt"

      - name: 更新并安装 Feeds (Update and Install Feeds)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          DIY_CTL="${{ github.workspace }}/config/immortalwrt-diy-control.txt"
          DIY_ENABLED=true
          if [ -f "$DIY_CTL" ]; then
            STATUS=$(grep -v '^[[:space:]]*#' "$DIY_CTL" | awk -v d="$DEVICE_NAME" '$1 == d {print $2; exit}')
            [ "$STATUS" = "false" ] && DIY_ENABLED=false
          fi
          if [ "$DIY_ENABLED" = "true" ]; then
            echo "DIY 已启用，执行自定义脚本"
            bash ${{ github.workspace }}/script/immortalwrt-actions-diy1.sh
            ./scripts/feeds update -a
            bash ${{ github.workspace }}/script/immortalwrt-actions-diy2.sh
          else
            echo "DIY 已禁用 (设备 $DEVICE_NAME 在控制文件中标记为 false)，跳过自定义脚本"
            ./scripts/feeds update -a
          fi
          ./scripts/feeds install -a

      - name: 准备配置文件 (Prepare Config File)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cp "${{ env.CONFIG_FILE }}" .config
          make defconfig
          mkdir -p files/etc/uci-defaults files/etc
          cp ${{ github.workspace }}/script/immortalwrt-uci-defaults.sh files/etc/uci-defaults/99-custom.sh
          echo "${{ matrix.device }} $(date +%Y%m%d%H%M%S) ${{ github.run_id }}" > files/etc/firmware-build-info
          bash ${{ github.workspace }}/script/x-wrt-make-001.sh

      - name: 编译固件，失败时不立即终止 (Compile Firmware)
        id: compile
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          THREAD_COUNT=$(nproc)
          echo "使用 $THREAD_COUNT 线程编译"

          # 记录退出码，不中断脚本以便后续处理
          make -j$THREAD_COUNT 2>&1 | tee make.log
          EXIT_CODE=${PIPESTATUS[0]}

          if [ $EXIT_CODE -ne 0 ]; then
            echo "多线程编译失败 (退出码: $EXIT_CODE)，切换单线程详细模式重新编译以定位错误..."
            make -j1 V=s 2>&1 | tee -a make.log
            EXIT_CODE=${PIPESTATUS[0]}
          fi

          if [ $EXIT_CODE -eq 0 ]; then
            # 验证是否真正生成了固件 (make 可能返回 0 但未生成固件)
            FIRMWARE_CHECK=$(find bin/targets -mindepth 2 -maxdepth 2 -type d 2>/dev/null | head -1)
            if [ -n "$FIRMWARE_CHECK" ]; then
              echo "编译成功完成！"
              echo "compile_completed=true" >> $GITHUB_OUTPUT
            else
              echo "编译通过但未生成固件文件 (可能 .config 未选择目标设备)"
              echo "compile_completed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "编译失败，退出码: $EXIT_CODE"
            echo "compile_completed=false" >> $GITHUB_OUTPUT
            # 不 exit 1，让工作流继续执行失败处理步骤
          fi

          # 截断过大的 make.log (GitHub Artifact 单文件限制约 2GB, 保留尾部便于排查)
          LOG_LINES=$(wc -l < make.log)
          if [ "$LOG_LINES" -gt "$LOG_TRUNCATE_LINES" ]; then
            echo "make.log 过大 ($LOG_LINES 行), 保留首尾各 $LOG_KEEP_LINES 行"
            head -$LOG_KEEP_LINES make.log > make.log.tmp
            echo "" >> make.log.tmp
            echo "...... [中间省略 $((LOG_LINES - LOG_KEEP_LINES * 2)) 行] ......" >> make.log.tmp
            echo "" >> make.log.tmp
            tail -$LOG_KEEP_LINES make.log >> make.log.tmp
            mv make.log.tmp make.log
            echo "make.log 已截断至 $(wc -l < make.log) 行"
          fi

      # ---------- 编译失败处理 ----------
      - name: 生成错误报告 (Generate Error Report)
        if: steps.compile.outputs.compile_completed == 'false'
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          {
            echo "## 编译失败 - ${{ matrix.device }}"
            echo ""
            echo "### 关键错误信息 (最后 50 条)"
            echo '```'
            grep -inE "$ERROR_PATTERN" make.log | tail -50 || echo "未匹配到关键错误，请查看完整日志"
            echo '```'
            echo ""
            echo "### 日志末尾 100 行"
            echo '```'
            tail -100 make.log
            echo '```'
          } > error_report.md
          cat error_report.md >> $GITHUB_STEP_SUMMARY

      - name: 上传失败日志 (Upload Failure Log)
        if: steps.compile.outputs.compile_completed == 'false'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: failed-build-log-${{ matrix.device }}-${{ github.run_id }}
          path: |
            ${{ env.OPENWRT_DIR }}/make.log
            ${{ env.OPENWRT_DIR }}/error_report.md
          retention-days: 7

      - name: 生成失败 Release 信息 (Generate Failure Release Info)
        if: steps.compile.outputs.compile_completed == 'false'
        id: failed_release
        run: |
          BUILD_DATETIME=$(date +"%Y%m%d%H%M")
          echo "BUILD_DATETIME=$BUILD_DATETIME" >> $GITHUB_ENV
          RELEASE_TAG="${{ matrix.device }}-failed-${BUILD_DATETIME}-${{ github.run_id }}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release_failed.txt <<EOF
          ## ❌ Build Failed — \`${{ matrix.device }}\`

          $(date '+%Y-%m-%d %H:%M:%S %Z') · \`${{ matrix.device }}\` · ${{ matrix.chip }}

          **Source**  $(cat "${{ env.SOURCE_CODE_URL_FILE }}")
          **Config**  \`$(basename "${{ env.CONFIG_FILE }}")\`

          ### 🔍 Error Summary

          EOF
          cat ${{ env.OPENWRT_DIR }}/error_report.md >> release_failed.txt
          {
            echo ""
            echo "---"
            echo "> 📋 Full log: **make.log** · [${{ github.workflow }} #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> release_failed.txt

      - name: 发布失败 Release (Create Failure Release - Draft)
        if: steps.compile.outputs.compile_completed == 'false'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.failed_release.outputs.release_tag }}
          name: "[编译失败] ${{ matrix.device }} - ${{ env.BUILD_DATETIME }}"
          body_path: release_failed.txt
          files: |
            ${{ env.OPENWRT_DIR }}/make.log
            ${{ env.OPENWRT_DIR }}/error_report.md
          draft: true
          prerelease: true

      # ---------- 编译成功处理 ----------
      - name: 压缩完整 bin 目录并整理固件 (Compress bin Directory and Organize Firmware)
        id: compress
        if: steps.compile.outputs.compile_completed == 'true'
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # 动态探测输出目录 (bin/targets/<target>/<subtarget>)，兼容不同芯片/平台
          TARGET_PATH=$(find bin/targets -mindepth 2 -maxdepth 2 -type d | head -n 1)
          if [ -z "$TARGET_PATH" ]; then
            echo "::warning::未找到编译输出目录，跳过固件打包"
            exit 0
          fi
          TARGET_NAME="${TARGET_PATH#bin/targets/}"
          echo "输出目录: $TARGET_PATH (平台: $TARGET_NAME)"
          echo "可用磁盘空间:"
          df -h .

          7z a -mx=9 -mmt=$(nproc) bin.7z bin/
          if [ $? -ne 0 ]; then
            echo "::error::bin.7z 打包失败"
            exit 1
          fi
          mv bin.7z "$TARGET_PATH/"
          mv make.log "$TARGET_PATH/"
          cd "$TARGET_PATH" || { echo "::error::无法进入 $TARGET_PATH"; exit 1; }
          rm -rf packages
          echo "固件文件列表:"
          ls -la $FW_GLOB *.7z *.log 2>/dev/null || true

          # 给固件文件名追加时间戳 (失败自动重试一次)
          TS_SUFFIX="_$(date +%Y%m%d%H%M)"
          for f in $FW_GLOB; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            newname="${base}${TS_SUFFIX}.${ext}"
            if mv "$f" "$newname" 2>/dev/null; then
              echo "  重命名: $f -> $newname"
            else
              sleep 1
              if [ -f "$newname" ]; then
                # 目标已存在 (上次 mv 部分成功)，清理源文件即可
                rm -f "$f" 2>/dev/null
                echo "  重命名(清理源): $f -> $newname"
              elif mv "$f" "$newname" 2>/dev/null; then
                echo "  重命名(重试成功): $f -> $newname"
              else
                echo "  ⚠️ 重命名失败: $f (保留原名)"
              fi
            fi
          done
          echo ""

          # 给 bin.7z 和 make.log 也追加时间戳
          for f in bin.7z make.log; do
            [ -f "$f" ] || continue
            base="${f%.*}"
            ext="${f##*.}"
            newname="${base}${TS_SUFFIX}.${ext}"
            mv "$f" "$newname" 2>/dev/null && echo "  重命名: $f -> $newname"
          done
          echo ""

          echo "TARGET_DIR=${{ env.OPENWRT_DIR }}/$TARGET_PATH" >> $GITHUB_ENV
          echo "TARGET_NAME=$TARGET_NAME" >> $GITHUB_ENV

          # 生成 SHA256 校验文件 (失败自动重试一次，仍失败则致命)
          FIRMWARE_FILES=$(ls $FW_GLOB 2>/dev/null)
          if [ -n "$FIRMWARE_FILES" ]; then
            if sha256sum $FIRMWARE_FILES > sha256sums.txt 2>/dev/null; then
              echo "SHA256 校验文件已生成"
            else
              sleep 1
              if sha256sum $FIRMWARE_FILES > sha256sums.txt 2>/dev/null; then
                echo "SHA256 校验文件已生成 (重试成功)"
              else
                echo "::error::SHA256 校验生成失败 (已重试)"
                exit 1
              fi
            fi
          fi

      - name: 生成构建信息 (Generate Build Info)
        if: steps.compile.outputs.compile_completed == 'true'
        run: |
          cd ${{ env.OPENWRT_DIR }}
          SOURCE_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          SOURCE_BRANCH=$(git branch --show-current 2>/dev/null || echo "unknown")

          cat > ${{ env.TARGET_DIR }}/build-info.txt << EOF
          Image Builder Info
          ==========================================
          Build Date:    $(date '+%Y-%m-%d %H:%M:%S %Z')
          Workflow:      ${{ github.workflow }}
          Run ID:        ${{ github.run_id }}
          Device:        ${{ matrix.device }}
          Chip:          ${{ matrix.chip }}
          Target:        ${{ env.TARGET_NAME }}
          Config:        $(basename "${{ env.CONFIG_FILE }}")
          Source Repo:   $(cat "${{ env.SOURCE_CODE_URL_FILE }}")
          Source Branch: ${SOURCE_BRANCH}
          Source Commit: ${SOURCE_COMMIT}
          GitHub Repo:   ${{ github.repository }}
          EOF
          echo "build-info.txt 已生成"

          # 存储源码信息供 Release 步骤使用
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> $GITHUB_ENV
          echo "SOURCE_COMMIT=${SOURCE_COMMIT}" >> $GITHUB_ENV

          # 输出成功摘要到 Actions 页面
          echo "| ✅ ${{ matrix.device }} | ${{ matrix.chip }} | ${{ env.TARGET_NAME }} | $(date '+%H:%M:%S') |" >> $GITHUB_STEP_SUMMARY

      - name: 上传固件 Artifact (Upload Firmware Artifact)
        if: steps.compile.outputs.compile_completed == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openwrt-firmware-${{ matrix.device }}
          path: ${{ env.TARGET_DIR }}/
          retention-days: 30

      - name: 生成成功 Release 信息 (Generate Success Release Info)
        if: steps.compile.outputs.compile_completed == 'true'
        id: success_release
        run: |
          BUILD_DATETIME=$(date +"%Y%m%d%H%M")
          echo "BUILD_DATETIME=$BUILD_DATETIME" >> $GITHUB_ENV

          RELEASE_TAG="${{ matrix.device }}-${BUILD_DATETIME}-${{ github.run_id }}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release_success.txt <<EOF
          ## ✅ ImmortalWrt Build — \`${{ matrix.device }}\`

          $(date '+%Y-%m-%d %H:%M:%S %Z') · \`${{ matrix.device }}\` · ${{ matrix.chip }} · ${{ env.TARGET_NAME }}

          **Source**  $(cat "${{ env.SOURCE_CODE_URL_FILE }}")  @ \`${SOURCE_BRANCH}\` (\`${SOURCE_COMMIT}\`)
          **Config**  \`$(basename "${{ env.CONFIG_FILE }}")\`

          ### 📦 Attached Files
          - **\`*sysupgrade.bin\` / \`*factory.img\`** — Firmware images
          - **\`*preloader.bin\` / \`*bl31-uboot.fip\`** — Bootloader files (if applicable)
          - **\`bin.7z\`** — Full build directory archive
          - **\`sha256sums.txt\`** — SHA256 checksums for all firmware files
          - **\`build-info.txt\`** — Build traceability (branch, commit, timestamp)
          - **\`make.log\`** — Compilation log

          ---
          > [${{ github.workflow }} #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

      - name: 发布成功 Release (Create Success Release)
        if: steps.compile.outputs.compile_completed == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.success_release.outputs.release_tag }}
          name: "ImmortalWRT ${{ matrix.device }} - ${{ env.BUILD_DATETIME }}"
          body_path: release_success.txt
          files: ${{ env.TARGET_DIR }}/*
          draft: false
          prerelease: false

  summarize:
    needs: [prepare, compile]
    if: always() && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 输出编译摘要 (Build Summary)
        run: |
          MATRIX='${{ needs.prepare.outputs.matrix }}'
          RESULT="${{ needs.compile.result == 'success' && '✅ 全部成功' || '⚠️ 部分失败' }}"
          DEVICES=$(echo "$MATRIX" | jq -r '[.[] | "**\(.device)** (\(.chip))"] | join(" · ")')

          {
            echo "# ${RESULT}"
            echo ""
            echo "${DEVICES}"
            echo ""
            echo "> $(date '+%Y-%m-%d %H:%M') · ${{ github.event_name }} · [${{ github.workflow }} #${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> $GITHUB_STEP_SUMMARY

      - name: 清理旧 Release (Clean Old Releases)
        uses: ophub/delete-releases-workflows@v0.1.0
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: true
          releases_keep_latest: 20
