name: 清理旧编译配置 (Clean Old Build Configs)

on:
  schedule:
    - cron: '0 15 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

# GITHUB_TOKEN 最小权限: 归档旧配置需要推送提交 (contents: write)
permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出仓库 (Checkout Repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: 清理旧配置 (Clean Old Configs)
        run: |
          CONFIG_DIR="${{ github.workspace }}/config/immortalwrt-mt798x"
          ARCHIVE_DIR="${{ github.workspace }}/config/old_configs"

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "配置目录不存在: $CONFIG_DIR"
            exit 0
          fi
          mkdir -p "$ARCHIVE_DIR"

          echo "扫描配置目录: $CONFIG_DIR"
          echo ""

          declare -A LATEST_CONFIGS
          declare -A LATEST_DATETIME
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ ^immortalwrt-actions-([a-z0-9]+)-(.+)-([0-9]{14})\.config$ ]]; then
              device="${BASH_REMATCH[2]}"
              datetime="${BASH_REMATCH[3]}"
              if [[ -z "${LATEST_CONFIGS[$device]}" ]] || [[ "$datetime" > "${LATEST_DATETIME[$device]}" ]]; then
                LATEST_CONFIGS["$device"]="$filename"
                LATEST_DATETIME["$device"]="$datetime"
              fi
            fi
          done < <(find "$CONFIG_DIR" -maxdepth 1 -type f -name "immortalwrt-actions-*.config" -print0)

          if [ ${#LATEST_CONFIGS[@]} -eq 0 ]; then
            echo "未找到任何配置文件，无需清理"
            exit 0
          fi

          MOVED_COUNT=0
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ ^immortalwrt-actions-([a-z0-9]+)-(.+)-([0-9]{14})\.config$ ]]; then
              device="${BASH_REMATCH[2]}"
              if [ "${LATEST_CONFIGS[$device]}" == "$filename" ]; then
                echo "保留: $filename"
              else
                echo "归档: $filename -> old_configs/"
                mv "$file" "$ARCHIVE_DIR/"
                MOVED_COUNT=$((MOVED_COUNT + 1))
              fi
            fi
          done < <(find "$CONFIG_DIR" -maxdepth 1 -type f -name "immortalwrt-actions-*.config" -print0)

          # 裁剪归档: 删除文件名时间戳超过 90 天的旧配置，控制仓库体积
          CUTOFF=$(date -d '90 days ago' +%Y%m%d%H%M%S)
          PRUNED=0
          while IFS= read -r -d '' file; do
            filename=$(basename "$file")
            if [[ "$filename" =~ ^immortalwrt-actions-([a-z0-9]+)-(.+)-([0-9]{14})\.config$ ]]; then
              if [[ "${BASH_REMATCH[3]}" < "$CUTOFF" ]]; then
                rm -f "$file"
                PRUNED=$((PRUNED + 1))
                echo "裁剪过期归档: $filename"
              fi
            fi
          done < <(find "$ARCHIVE_DIR" -maxdepth 1 -type f -name "immortalwrt-actions-*.config" -print0 2>/dev/null)
          echo "共裁剪 $PRUNED 个过期归档 (90 天前)"

          echo ""
          echo "========== 清理完成 =========="
          for dev in "${!LATEST_CONFIGS[@]}"; do
            echo "设备 [$dev] 保留: ${LATEST_CONFIGS[$dev]}"
          done
          echo "共归档 $MOVED_COUNT 个旧配置文件"

      - name: 提交并推送变更 (Commit and Push Changes)
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/immortalwrt-mt798x/ config/old_configs/
          git commit -m "Clean old build configs [skip ci]

          - 每个设备仅保留最新配置，其余归档至 old_configs/"
          PUSH_OK=false
          for i in 1 2 3; do
            if git push; then
              echo "推送成功"
              PUSH_OK=true
              break
            fi
            echo "push 失败，第 ${i} 次重试..."
            sleep 5
          done
          # 原写法 done || { ... } 因 for 循环退出码恒为 sleep 的 0，错误分支永远不会执行
          if [ "$PUSH_OK" != "true" ]; then
            echo "::error::git push 失败 (已重试 3 次)，下次定时执行时将自动重试"
            exit 1
          fi
